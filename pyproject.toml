[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halgo2"
version = "1.0.0"
description = "Deterministic hallucination detection against trusted source material."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE" }
authors = [
  { name = "Tangible Research" }
]
dependencies = [
  "Django>=5.0,<6",
  "numpy<2",
  "beautifulsoup4>=4.12",
  "clean-text>=0.6",
  "fastcoref>=2.1",
  "html2text>=2024.2.26",
  "markdown-it-py>=3",
  "negspacy>=1.0",
  "nltk>=3.8",
  "openai>=1.0",
  "pydantic>=2",
  "pysbd>=0.3",
  "quantulum3[classifier]>=0.9",
  "requests>=2.31",
  "rich>=13",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.7",
  "spacy>=3.7",
  "spacy-curated-transformers>=0.3",
  "sympy>=1.12",
  "textacy>=0.13",
  "stemming>=1.0",
  "torch>=2",
  "transformers>=4",
]

[project.scripts]
halgorithem = "Halgorithem.main:main"
halgo2-server = "Halgorithem.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
advanced = ["spacy-curated-transformers>=0.3"]

[tool.setuptools.packages.find]
include = ["Halgorithem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
